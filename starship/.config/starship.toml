format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$line_break$character"""

[os]
disabled = false

[os.symbols]
Arch = "󰣇"

[username]
show_always = true
format = '[ \[$user\] ]($style)'

[hostname]
ssh_only = false
format = '[\[$hostname\] ]($style)'

[directory]
format = '[\[$path\] ]($style)'
truncation_length = 3

[git_branch]
symbol = ""
format = '[$symbol $branch ]($style)'

[git_status]
format = '[($all_status$ahead_behind )]($style)'

[line_break]
disabled = false

[character]
disabled = false
